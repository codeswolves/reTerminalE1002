  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f5f6f8;
    font-family:"EInkCJK", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "WenQuanYi Micro Hei", "WenQuanYi Zen Hei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #e5e7eb;
  }
  .dash {
    width: 800px;
    height: 480px;
    background: #ffffff;
    border: 1px solid #d0d6e0;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px;
  }
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 16px;
    background: #f0f2f7;
    border: 1px solid #d0d6e0;
    border-radius: 10px;
  }
  .tb-date { font-size: 16px; color: #5a6577; }
  .tb-slogan { font-size: 18px; font-weight: 600; color: #1f2733; letter-spacing: 1px; }
  .tb-weather { display: flex; align-items: center; gap: 8px; font-size: 16px; color: #8893a7; }
  .content {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 16px;
  }
  .col-left { width: 340px; display: flex; flex-direction: column; }
  .col-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }

  .panel {
    background: #f0f2f7;
    border: 1px solid #d0d6e0;
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 600;
    color: #1f2733;
    margin-bottom: 3px;
    letter-spacing: 0.5px;
    flex: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* gauge */
  .gauge-panel { align-items: center; }
  /*调整3个圈的位置，10px上移，4px下移*/
  .gauge-wrap { margin: 10px 0 4px; } 
  /*2026年目标的图例位置调整，gap: 6px(行间距) 14px(三个图例之间的距离);*/
  .legend { width: 100%; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 6px 12px; margin-top: 8px; }
  .legend-row {
    display: flex;
    align-items: center;
    font-size: 14px;
    line-height: 1.2;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; flex: none; }
  .lg-name { color: #5a6577; flex: none; }

  /* tasks */
  .tasks-panel { flex: none; }
  .task-done-count {
    font-size: 11px;
    font-weight: 600;
    color: #1f2733;
    background: #e3e8f0;
    border-radius: 10px;
    padding: 1px 8px;
    line-height: 1.6;
    flex: none;
  }
  .task { margin-bottom: 5px; }
  .task:last-child { margin-bottom: 0; }
  /*每日任务的字体在这里调整*/
  .task-head {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .task-val { font-weight: 600; }
  .bar {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    background: #e3e8f0;
  }
  .seg { height: 100%; }
  .task-legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px 16px;
    margin-top: 8px;
    font-size: 14px;
    color: #8893a7;
  }
  .task-legend .lbl { color: #3a4456; }
  .task-legend .sws { display: flex; gap: 5px; }
  .task-legend span { display: flex; align-items: center; gap: 4px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }

  /* calendar */
  .calendar-panel { flex: 1; }
  .cal-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
  .cal-date { font-size: 14px; color: #8893a7; }
  .cal-stats {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    margin-left: 8px;
  }
  .cal-stats-num {
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
  }
  .cal-stats-label {
    font-size: 12px;
    color: #8893a7;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
  }
  /*日历的字体*/
  .cal-grid.wk { margin-bottom: 2px; }
  .wk span {
    text-align: center;
    font-size: 14px;
    color: #8893a7;
  }
  .cell {
    height: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1;
    border-radius: 4px;
  }
  .cell.empty { background: transparent; }
  /*日历下面图例的字体*/
  .cal-legend {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 4px;
    font-size: 14px;
  }
  .cal-legend span { display: flex; align-items: center; gap: 5px; }
  </style>
</head>

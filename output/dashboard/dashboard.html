<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人仪表盘 800x480</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f5f6f8;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "WenQuanYi Micro Hei", "WenQuanYi Zen Hei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #e5e7eb;
  }
  .dash {
    width: 800px;
    height: 480px;
    background: #ffffff;
    border: 1px solid #d0d6e0;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px;
  }
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 16px;
    background: #f0f2f7;
    border: 1px solid #d0d6e0;
    border-radius: 10px;
  }
  .tb-date { font-size: 16px; color: #5a6577; }
  .tb-slogan { font-size: 18px; font-weight: 600; color: #1f2733; letter-spacing: 1px; }
  .tb-weather { display: flex; align-items: center; gap: 8px; font-size: 16px; color: #8893a7; }
  .content {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 16px;
  }
  .col-left { width: 340px; display: flex; flex-direction: column; }
  .col-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }

  .panel {
    background: #f0f2f7;
    border: 1px solid #d0d6e0;
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 600;
    color: #1f2733;
    margin-bottom: 3px;
    letter-spacing: 0.5px;
    flex: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* gauge */
  .gauge-panel { align-items: center; }
  /*调整3个圈的位置，10px上移，4px下移*/
  .gauge-wrap { margin: 10px 0 4px; } 
  /*2026年目标的图例位置调整，gap: 6px(行间距) 14px(三个图例之间的距离);*/
  .legend { width: 100%; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 6px 12px; margin-top: 8px; }
  .legend-row {
    display: flex;
    align-items: center;
    font-size: 14px;
    line-height: 1.2;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; flex: none; }
  .lg-name { color: #5a6577; flex: none; }

  /* tasks */
  .tasks-panel { flex: none; }
  .task-done-count {
    font-size: 11px;
    font-weight: 600;
    color: #1f2733;
    background: #e3e8f0;
    border-radius: 10px;
    padding: 1px 8px;
    line-height: 1.6;
    flex: none;
  }
  .task { margin-bottom: 5px; }
  .task:last-child { margin-bottom: 0; }
  /*每日任务的字体在这里调整*/
  .task-head {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .task-val { font-weight: 600; }
  .bar {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    background: #e3e8f0;
  }
  .seg { height: 100%; }
  .task-legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px 16px;
    margin-top: 8px;
    font-size: 14px;
    color: #8893a7;
  }
  .task-legend .lbl { color: #3a4456; }
  .task-legend .sws { display: flex; gap: 5px; }
  .task-legend span { display: flex; align-items: center; gap: 4px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }

  /* calendar */
  .calendar-panel { flex: 1; }
  .cal-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
  .cal-date { font-size: 14px; color: #8893a7; }
  .cal-stats {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    margin-left: 8px;
  }
  .cal-stats-num {
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
  }
  .cal-stats-label {
    font-size: 12px;
    color: #8893a7;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
  }
  /*日历的字体*/
  .cal-grid.wk { margin-bottom: 2px; }
  .wk span {
    text-align: center;
    font-size: 14px;
    color: #8893a7;
  }
  .cell {
    height: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1;
    border-radius: 4px;
  }
  .cell.empty { background: transparent; }
  /*日历下面图例的字体*/
  .cal-legend {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 4px;
    font-size: 14px;
  }
  .cal-legend span { display: flex; align-items: center; gap: 5px; }
  </style>
</head>
<body>
  <div class="dash">
    <div class="topbar">
      <div class="tb-date" id="tbDate">2026年9月1日 周二</div>
      <div class="tb-slogan">自强不息，厚德载物</div>
      <div class="tb-weather">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4" fill="#fbbf24"/><g stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"><line x1="8" y1="0.5" x2="8" y2="2.5"/><line x1="8" y1="13.5" x2="8" y2="15.5"/><line x1="0.5" y1="8" x2="2.5" y2="8"/><line x1="13.5" y1="8" x2="15.5" y2="8"/><line x1="2.5" y1="2.5" x2="3.9" y2="3.9"/><line x1="12.1" y1="12.1" x2="13.5" y2="13.5"/><line x1="13.5" y1="2.5" x2="12.1" y2="3.9"/><line x1="3.9" y1="12.1" x2="2.5" y2="13.5"/></g></svg>
        <span>北京 23°C 晴</span>
      </div>
    </div>
    <div class="content">
    <div class="col-left">
      <div class="panel gauge-panel" style="flex:1;">
        <div class="panel-title" style="font-size:19px;">2026年目标</div>
        <div class="gauge-wrap">
          <svg viewBox="0 0 210 210" width="300" height="300" role="img" aria-label="三环进度仪表盘">
            <title>2026年目标三环进度</title>
            <g transform="rotate(-120 105 105)">
              <circle cx="105" cy="105" r="92" fill="none" stroke="#d0d6e0" stroke-width="20"/><circle cx="105" cy="105" r="92" fill="none" stroke="#3b6fb0" stroke-width="20" stroke-linecap="round" stroke-dasharray="294.81 578.05"/><circle cx="105" cy="105" r="58" fill="none" stroke="#d0d6e0" stroke-width="20"/><circle cx="105" cy="105" r="58" fill="none" stroke="#d6453d" stroke-width="20" stroke-linecap="round" stroke-dasharray="120.26 364.42"/><circle cx="105" cy="105" r="24" fill="none" stroke="#d0d6e0" stroke-width="20"/><circle cx="105" cy="105" r="24" fill="none" stroke="#2e9e5b" stroke-width="20" stroke-linecap="round" stroke-dasharray="49.76 150.80"/>
            </g>
            <text x="105" y="13" text-anchor="middle" dominant-baseline="middle" fill="#1f2733" font-size="14" font-weight="700">51%</text><text x="105" y="47" text-anchor="middle" dominant-baseline="middle" fill="#1f2733" font-size="14" font-weight="700">33%</text><text x="105" y="81" text-anchor="middle" dominant-baseline="middle" fill="#1f2733" font-size="14" font-weight="700">33%</text>
          </svg>
        </div>
        <div class="legend"><div class="legend-row"><span class="dot" style="background:#3b6fb0"></span><span class="lg-name">减重40斤</span></div><div class="legend-row"><span class="dot" style="background:#d6453d"></span><span class="lg-name">论文3篇</span></div><div class="legend-row"><span class="dot" style="background:#2e9e5b"></span><span class="lg-name">专利3篇</span></div></div>
      </div>
    </div>
    <div class="col-right">
      <div class="panel tasks-panel">
        <div class="panel-title" style="color:#1f2733">每日任务<span class="task-done-count">累计完成  18</span></div>
        <div class="task">
          <div class="task-head"><span style="color:#3a4456">完成网络测量标准提纲</span><span class="task-val" style="color:#1f2733">26%</span></div>
          <div class="bar">
            <div class="seg" style="width:26%;background:#3b6fb0"></div>
            <div class="seg" style="width:0%;background:rgba(59,111,176,0.35)"></div>
          </div>
        </div><div class="task">
          <div class="task-head"><span style="color:#3a4456">完成测量专利编写</span><span class="task-val" style="color:#1f2733">5%</span></div>
          <div class="bar">
            <div class="seg" style="width:5%;background:#d6453d"></div>
            <div class="seg" style="width:0%;background:rgba(214,69,61,0.35)"></div>
          </div>
        </div><div class="task">
          <div class="task-head"><span style="color:#3a4456">完成时变路由报告修改</span><span class="task-val" style="color:#1f2733">60%</span></div>
          <div class="bar">
            <div class="seg" style="width:0%;background:#2e9e5b"></div>
            <div class="seg" style="width:60%;background:rgba(46,158,91,0.35)"></div>
          </div>
        </div>
        <div class="task-legend">
        <span class="lbl" style="color:#3a4456">昨天完成</span>
        <span class="sws"><i class="sw" style="background:#3b6fb0"></i><i class="sw" style="background:#d6453d"></i><i class="sw" style="background:#2e9e5b"></i></span>
        <span class="lbl" style="color:#3a4456">今天推进</span>
        <span class="sws"><i class="sw" style="background:rgba(59,111,176,0.35)"></i><i class="sw" style="background:rgba(214,69,61,0.35)"></i><i class="sw" style="background:rgba(46,158,91,0.35)"></i></span>
      </div>
      </div>
      <div class="panel calendar-panel">
        <div class="cal-header">
          <span class="panel-title" style="margin:0;color:#1f2733">健身打卡</span>
          <span class="cal-stats">
            <span class="cal-stats-label">累计打卡</span>
            <span class="cal-stats-num" style="color:#1f2733">24</span>
            <span class="cal-stats-label">天</span>
          </span>
          <span class="cal-date">2026 年 09 月</span>
        </div>
        <div class="cal-grid wk"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="cal-grid"><span class="cell empty"></span><span class="cell today" style="background:#d29922;color:#ffffff">1</span><span class="cell" style="background:#e3e8f0;color:#3a4456">2</span><span class="cell" style="background:#e3e8f0;color:#3a4456">3</span><span class="cell" style="background:#e3e8f0;color:#3a4456">4</span><span class="cell" style="background:#e3e8f0;color:#3a4456">5</span><span class="cell" style="background:#e3e8f0;color:#3a4456">6</span><span class="cell" style="background:#e3e8f0;color:#3a4456">7</span><span class="cell" style="background:#e3e8f0;color:#3a4456">8</span><span class="cell" style="background:#e3e8f0;color:#3a4456">9</span><span class="cell" style="background:#e3e8f0;color:#3a4456">10</span><span class="cell" style="background:#e3e8f0;color:#3a4456">11</span><span class="cell" style="background:#e3e8f0;color:#3a4456">12</span><span class="cell" style="background:#e3e8f0;color:#3a4456">13</span><span class="cell" style="background:#e3e8f0;color:#3a4456">14</span><span class="cell" style="background:#e3e8f0;color:#3a4456">15</span><span class="cell" style="background:#e3e8f0;color:#3a4456">16</span><span class="cell" style="background:#e3e8f0;color:#3a4456">17</span><span class="cell" style="background:#e3e8f0;color:#3a4456">18</span><span class="cell" style="background:#e3e8f0;color:#3a4456">19</span><span class="cell" style="background:#e3e8f0;color:#3a4456">20</span><span class="cell" style="background:#e3e8f0;color:#3a4456">21</span><span class="cell" style="background:#e3e8f0;color:#3a4456">22</span><span class="cell" style="background:#e3e8f0;color:#3a4456">23</span><span class="cell" style="background:#e3e8f0;color:#3a4456">24</span><span class="cell" style="background:#e3e8f0;color:#3a4456">25</span><span class="cell" style="background:#e3e8f0;color:#3a4456">26</span><span class="cell" style="background:#e3e8f0;color:#3a4456">27</span><span class="cell" style="background:#e3e8f0;color:#3a4456">28</span><span class="cell" style="background:#e3e8f0;color:#3a4456">29</span><span class="cell" style="background:#e3e8f0;color:#3a4456">30</span></div>
        <div class="cal-legend">
          <span style="color:#8893a7"><i class="sw" style="background:#d29922"></i>今天</span>
          <span style="color:#8893a7"><i class="sw" style="background:rgba(46,158,91,0.18)"></i>已打卡</span>
        </div>
      </div>
    </div>
    </div>
  </div>
  <script>
    (function(){
      var d = new Date();
      var wk = ['周日','周一','周二','周三','周四','周五','周六'];
      var s = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+wk[d.getDay()];
      var el = document.getElementById('tbDate');
      if(el) el.textContent = s;
    })();
  </script>
</body>
</html>

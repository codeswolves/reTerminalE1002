<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人仪表盘 800x400</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #010409;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #e5e7eb;
  }
  .dash {
    width: 800px;
    height: 400px;
    background: #0d1117;
    border: 1px solid #1f6feb;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
  }
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    background: #161b22;
    border: 1px solid #1f6feb;
    border-radius: 10px;
  }
  .tb-date { font-size: 13px; color: #58a6ff; }
  .tb-slogan { font-size: 14px; font-weight: 600; color: #8b949e; letter-spacing: 1px; }
  .tb-weather { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #8b949e; }
  .content {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 16px;
  }
  .col-left { width: 340px; display: flex; flex-direction: column; }
  .col-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

  .panel {
    background: #161b22;
    border: 1px solid #1f6feb;
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 600;
    color: #e6edf3;
    margin-bottom: 3px;
    letter-spacing: 0.5px;
    flex: none;
  }

  /* gauge */
  .gauge-panel { align-items: center; }
  .gauge-panel .panel-title { font-size: 17px; align-self: flex-start; }
  .gauge-wrap { margin: 1px 0 4px; }
  .legend { width: 100%; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 6px 16px; }
  .legend-row {
    display: flex;
    align-items: center;
    font-size: 12px;
    line-height: 1.2;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; flex: none; }
  .lg-name { color: #8b949e; flex: none; }
  .lg-pct { font-weight: 700; font-size: 14px; margin-left: 4px; }

  /* tasks */
  .tasks-panel { flex: none; }
  .task { margin-bottom: 3px; }
  .task:last-child { margin-bottom: 0; }
  .task-head {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 3px;
  }
  .task-val { font-weight: 600; }
  .bar {
    display: flex;
    height: 5px;
    border-radius: 4px;
    overflow: hidden;
    background: #21262d;
  }
  .seg { height: 100%; }
  .task-legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px 16px;
    margin-top: 6px;
    font-size: 11px;
    color: #8b949e;
  }
  .task-legend .lbl { color: #e6edf3; }
  .task-legend .sws { display: flex; gap: 5px; }
  .task-legend span { display: flex; align-items: center; gap: 4px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }

  /* calendar */
  .calendar-panel { flex: 1; }
  .cal-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
  .cal-date { font-size: 12px; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
  }
  .cal-grid.wk { margin-bottom: 1px; }
  .wk span {
    text-align: center;
    font-size: 11px;
    color: #8b949e;
  }
  .cell {
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    line-height: 1;
    border-radius: 4px;
  }
  .cell.empty { background: transparent; }
  .cal-legend {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 3px;
    font-size: 11px;
  }
  .cal-legend span { display: flex; align-items: center; gap: 5px; }
  </style>
</head>
<body>
  <div class="dash">
    <div class="topbar">
      <div class="tb-date" id="tbDate">2026年8月1日 周六</div>
      <div class="tb-slogan">日日精进 · 知行合一</div>
      <div class="tb-weather">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4" fill="#fbbf24"/><g stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"><line x1="8" y1="0.5" x2="8" y2="2.5"/><line x1="8" y1="13.5" x2="8" y2="15.5"/><line x1="0.5" y1="8" x2="2.5" y2="8"/><line x1="13.5" y1="8" x2="15.5" y2="8"/><line x1="2.5" y1="2.5" x2="3.9" y2="3.9"/><line x1="12.1" y1="12.1" x2="13.5" y2="13.5"/><line x1="13.5" y1="2.5" x2="12.1" y2="3.9"/><line x1="3.9" y1="12.1" x2="2.5" y2="13.5"/></g></svg>
        <span>北京 27°C 晴</span>
      </div>
    </div>
    <div class="content">
    <div class="col-left">
      <div class="panel gauge-panel" style="flex:1;">
        <div class="panel-title" style="font-size:17px;">2026年目标</div>
        <div class="gauge-wrap">
          <svg viewBox="0 0 210 210" width="250" height="250" role="img" aria-label="三环进度仪表盘">
            <title>2026年目标三环进度</title>
            <g transform="rotate(-120 105 105)">
              <circle cx="105" cy="105" r="92" fill="none" stroke="#21262d" stroke-width="20"/><circle cx="105" cy="105" r="92" fill="none" stroke="#58a6ff" stroke-width="20" stroke-linecap="round" stroke-dasharray="161.85 578.05"/><circle cx="105" cy="105" r="58" fill="none" stroke="#21262d" stroke-width="20"/><circle cx="105" cy="105" r="58" fill="none" stroke="#f85149" stroke-width="20" stroke-linecap="round" stroke-dasharray="240.52 364.42"/><circle cx="105" cy="105" r="24" fill="none" stroke="#21262d" stroke-width="20"/><circle cx="105" cy="105" r="24" fill="none" stroke="#3fb950" stroke-width="20" stroke-linecap="round" stroke-dasharray="49.76 150.80"/>
            </g>
            <text x="105" y="13" text-anchor="middle" dominant-baseline="middle" fill="#e6edf3" font-size="14" font-weight="700">28%</text><text x="105" y="47" text-anchor="middle" dominant-baseline="middle" fill="#e6edf3" font-size="14" font-weight="700">66%</text><text x="105" y="81" text-anchor="middle" dominant-baseline="middle" fill="#e6edf3" font-size="14" font-weight="700">33%</text>
          </svg>
        </div>
        <div class="legend"><div class="legend-row"><span class="dot" style="background:#58a6ff"></span><span class="lg-name" style="color:#8b949e">减重40斤</span><span class="lg-pct" style="color:#58a6ff">28%</span></div><div class="legend-row"><span class="dot" style="background:#f85149"></span><span class="lg-name" style="color:#8b949e">论文3篇</span><span class="lg-pct" style="color:#f85149">66%</span></div><div class="legend-row"><span class="dot" style="background:#3fb950"></span><span class="lg-name" style="color:#8b949e">专利3篇</span><span class="lg-pct" style="color:#3fb950">33%</span></div></div>
      </div>
    </div>
    <div class="col-right">
      <div class="panel tasks-panel">
        <div class="panel-title" style="color:#e6edf3">每日任务</div>
        <div class="task">
          <div class="task-head"><span style="color:#e6edf3">完成项目需求文档</span><span class="task-val" style="color:#58a6ff">100%</span></div>
          <div class="bar">
            <div class="seg" style="width:60%;background:#58a6ff"></div>
            <div class="seg" style="width:40%;background:rgba(88,166,255,0.35)"></div>
          </div>
        </div><div class="task">
          <div class="task-head"><span style="color:#e6edf3">前端页面开发</span><span class="task-val" style="color:#58a6ff">75%</span></div>
          <div class="bar">
            <div class="seg" style="width:45%;background:#f85149"></div>
            <div class="seg" style="width:30%;background:rgba(248,81,73,0.35)"></div>
          </div>
        </div><div class="task">
          <div class="task-head"><span style="color:#e6edf3">代码审查PR#42</span><span class="task-val" style="color:#58a6ff">100%</span></div>
          <div class="bar">
            <div class="seg" style="width:60%;background:#3fb950"></div>
            <div class="seg" style="width:40%;background:rgba(63,185,80,0.35)"></div>
          </div>
        </div>
        <div class="task-legend">
        <span class="lbl" style="color:#e6edf3">昨天完成</span>
        <span class="sws"><i class="sw" style="background:#58a6ff"></i><i class="sw" style="background:#f85149"></i><i class="sw" style="background:#3fb950"></i></span>
        <span class="lbl" style="color:#e6edf3">今天推进</span>
        <span class="sws"><i class="sw" style="background:rgba(88,166,255,0.35)"></i><i class="sw" style="background:rgba(248,81,73,0.35)"></i><i class="sw" style="background:rgba(63,185,80,0.35)"></i></span>
      </div>
      </div>
      <div class="panel calendar-panel">
        <div class="cal-header">
          <span class="panel-title" style="margin:0;color:#e6edf3">健身打卡</span>
          <span class="cal-date" style="color:#8b949e">2026 年 08 月</span>
        </div>
        <div class="cal-grid wk"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="cal-grid"><span class="cell empty"></span><span class="cell empty"></span><span class="cell empty"></span><span class="cell empty"></span><span class="cell empty"></span><span class="cell today" style="background:#d29922;color:#0d1117">1</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">2</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">3</span><span class="cell" style="background:#21262d;color:#e6edf3">4</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">5</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">6</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">7</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">8</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">9</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">10</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">11</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">12</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">13</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">14</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">15</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">16</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">17</span><span class="cell" style="background:#21262d;color:#e6edf3">18</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">19</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">20</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">21</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">22</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">23</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">24</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">25</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">26</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">27</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">28</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">29</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">30</span><span class="cell done" style="background:rgba(63,185,80,0.18);color:#3fb950">31</span></div>
        <div class="cal-legend">
          <span style="color:#8b949e"><i class="sw" style="background:#d29922"></i>今天</span>
          <span style="color:#8b949e"><i class="sw" style="background:rgba(63,185,80,0.18)"></i>已打卡</span>
        </div>
      </div>
    </div>
    </div>
  </div>
  <script>
    (function(){
      var d = new Date();
      var wk = ['周日','周一','周二','周三','周四','周五','周六'];
      var s = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+wk[d.getDay()];
      var el = document.getElementById('tbDate');
      if(el) el.textContent = s;
    })();
  </script>
</body>
</html>
